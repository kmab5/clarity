<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clarity - One Minute Decisions</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: transparent;
      }
      html {
         background-color: #0f172a;
      }
      .font-serif {
        font-family: 'Playfair Display', serif;
      }
      
      @keyframes float {
        0% { transform: translate(0px, 0px) rotate(0deg) scale(1); }
        33% { transform: translate(40px, -60px) rotate(5deg) scale(1.1); }
        66% { transform: translate(-30px, 30px) rotate(-5deg) scale(0.95); }
        100% { transform: translate(0px, 0px) rotate(0deg) scale(1); }
      }
      
      @keyframes float-reverse {
        0% { transform: translate(0px, 0px) rotate(0deg) scale(1); }
        33% { transform: translate(-40px, 50px) rotate(-5deg) scale(1.1); }
        66% { transform: translate(30px, -30px) rotate(5deg) scale(0.9); }
        100% { transform: translate(0px, 0px) rotate(0deg) scale(1); }
      }

      @keyframes spin-slow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      @keyframes reverse-spin {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }

      .animate-blob {
        animation: float 20s infinite ease-in-out;
      }
      
      .animate-blob-reverse {
        animation: float-reverse 25s infinite ease-in-out;
      }

      .animate-spin-slow {
        animation: spin-slow 8s linear infinite;
      }

      .animate-reverse-spin {
        animation: reverse-spin 6s linear infinite;
      }

      .animation-delay-2000 {
        animation-delay: 5s;
      }
      .animation-delay-4000 {
        animation-delay: 10s;
      }
      
      /* Utility for hiding scrollbar but allowing scroll */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>
  <script type="importmap">
{

    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/"

}
</script>
</head>

    <div id="root"></div>
  </body>
</html>
